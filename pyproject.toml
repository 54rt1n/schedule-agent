[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scheduling_agent"
version = "0.1.0"
description = "A2A Scheduling Agent for calendar management"
readme = "README.md"
requires-python = ">=3.10" # Changed from >=3.10 to >=3.12 as per section 1, but kept 3.10 from section 2 for now. Will adjust if needed.
license = { file = "LICENSE" } # Will need to create LICENSE later
authors = [
  { name = "Your Name", email = "your.email@example.com" } # Placeholder - User should update
]
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn>=0.23.2",
  "sqlalchemy[asyncio]>=2.0.22", # Added [asyncio] extra for SQLAlchemy
  "sqlmodel>=0.0.14", # Added SQLModel as per section 3
  "pydantic>=2.4.2",
  "pydantic-settings", # Added pydantic-settings
  "python-dateutil>=2.8.2",
  "icalendar>=5.0.7",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.8.0",
  "openai>=1.1.1",
  "dateparser>=1.1.8",
  "httpx>=0.25.0",
  "structlog>=23.2.0",
  "alembic>=1.12.0",
  "sqlite-utils>=3.35.0",
  "asyncpg", # Added driver for PostgreSQL, can be changed to psycopg if preferred
  "greenlet", # Required by SQLAlchemy async
  "aiosqlite", # Added driver for async SQLite
  "zoneinfo; python_version < '3.9'", # For zoneinfo backport if needed, though requires-python >= 3.10
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.2",
  "pytest-asyncio>=0.21.1",
  "mypy>=1.6.1",
  "ruff>=0.1.0",
  "httpx>=0.25.0",
  "types-python-dateutil>=2.8.19.14",
  "types-PyJWT>=1.7.1",
  "types-sqlalchemy", # Added types for SQLAlchemy
  "types-pytz", # Although using zoneinfo, some libs might still need this
  "uv", # Add uv itself as a dev dependency
  "pre-commit", # Useful for hooks
]

[project.scripts]
schedule-agent = "scheduling_agent.__main__:main" # Example entry point

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "DTZ",# flake8-datetimez
    "T10",# flake8-debugger
    "EM", # flake8-errmsg
    "ISC",# flake8-implicit-str-concat
    "ICN",# flake8-import-conventions
    "G",  # flake8-logging-format
    "INP",# flake8-no-pep420
    "PIE",# flake8-pie
    "T20",# flake8-print
    "PYI",# flake8-pyi
    "PT", # flake8-pytest-style
    "Q",  # flake8-quotes
    "RSE",# flake8-raise
    "RET",# flake8-return
    "SLF",# flake8-self
    "SIM",# flake8-simplify
    "TID",# flake8-tidy-imports
    "TCH",# flake8-type-checking
    "ARG",# flake8-unused-arguments
    "PTH",# flake8-use-pathlib
    "ERA",# eradicate
    "PD", # pandas-vet
    "PGH",# pygrep-hooks
    "PL", # Pylint
    "TRY",# tryceratops
    "RUF",# Ruff-specific rules
]
ignore = [
    "E501", # Line too long, handled by formatter
    "B008", # Function call argument isn't a literal (FastAPI dependencies)
    "C901", # Complex function (sometimes necessary)
    "PLR2004", # Magic value used in comparison (common in configs/constants)
    "PLR0913", # Too many arguments (FastAPI dependencies)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["scheduling_agent"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true # Start with true, gradually reduce
# Add plugins if needed, e.g., for Pydantic, SQLAlchemy
# plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.sources]
# Example of adding a private index if needed
# my-index = { url = "https://my-private-index.com/simple" } 