[project]
name = "scheduling_agent"
version = "0.1.1"
description = "Scheduling Agent for calendar management"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [
  { name = "Martin Bukowski", email = "martin@bmds.us" }
]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []


[project.optional-dependencies]
dev = [
  "pytest>=7.4.2",
  "pytest-asyncio>=0.21.1",
  "mypy>=1.6.1",
  "ruff>=0.1.0",
  "httpx>=0.25.0",
  "types-python-dateutil>=2.8.19.14",
  "types-PyJWT>=1.7.1",
  "types-sqlalchemy",
  "types-pytz",
  "uv",
  "pre-commit",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "N",  # pep8-naming
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4", # flake8-comprehensions
    "DTZ",# flake8-datetimez
    "T10",# flake8-debugger
    "EM", # flake8-errmsg
    "ISC",# flake8-implicit-str-concat
    "ICN",# flake8-import-conventions
    "G",  # flake8-logging-format
    "INP",# flake8-no-pep420
    "PIE",# flake8-pie
    "T20",# flake8-print
    "PYI",# flake8-pyi
    "PT", # flake8-pytest-style
    "Q",  # flake8-quotes
    "RSE",# flake8-raise
    "RET",# flake8-return
    "SLF",# flake8-self
    "SIM",# flake8-simplify
    "TID",# flake8-tidy-imports
    "TCH",# flake8-type-checking
    "ARG",# flake8-unused-arguments
    "PTH",# flake8-use-pathlib
    "ERA",# eradicate
    "PD", # pandas-vet
    "PGH",# pygrep-hooks
    "PL", # Pylint
    "TRY",# tryceratops
    "RUF",# Ruff-specific rules
]
ignore = [
    "E501", # Line too long, handled by formatter
    "B008", # Function call argument isn't a literal (FastAPI dependencies)
    "C901", # Complex function (sometimes necessary)
    "PLR2004", # Magic value used in comparison (common in configs/constants)
    "PLR0913", # Too many arguments (FastAPI dependencies)
    "TRY003", # Allow long exception messages
    "RET504", # Allow unnecessary variable assignment before return
    "G004", # Allow f-string literals in logging calls
    "RUF005", # Allow unnecessary list/dict/tuple concatenations
    "EM102", # Allow f-string literals in exception messages
    "PLR0911", # Allow many return statements (stylistic)
    "TRY300", # Allow statements in try block that could be in else (stylistic)
    "PLR0915", # Allow many statements in function (stylistic)
    "TRY301", # Allow raise without abstracting to function (stylistic)
    "RSE102", # Allow unnecessary parentheses on raised exceptions (stylistic)
    "EM101", # Allow string literals in exceptions (stylistic, similar to EM102)
]

# Add per-file ignores here
[tool.ruff.lint.per-file-ignores]
"tests/unit/*.py" = ["SLF001", "DTZ001", "ARG001", "ARG002", "F841"]
"tests/integration/api/*.py" = ["ARG001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
check_untyped_defs = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
schedule-core = { workspace = true }
schedule-cli = { workspace = true }
