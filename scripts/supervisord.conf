[supervisord]
nodaemon=true
user=appuser
logfile=/app/local/supervisord.log
pidfile=/app/local/supervisord.pid

[program:a2a-server]
command=uvicorn sa.api.__main__:create_app --factory --host %(ENV_API_HOST)s --port %(ENV_API_PORT)s --log-level %(ENV_LOG_LEVEL)s --no-access-log
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/local/a2a-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:mcp-server]
command=python -m sa.mcp --host %(ENV_MCP_HOST)s --port %(ENV_MCP_PORT)s
directory=/app
user=appuser
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/local/mcp-server.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3 