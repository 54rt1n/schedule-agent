[pytest]
# Add basic options (merged)
addopts = --ignore=vendor -ra -q --color=yes --tb=line --capture=tee-sys

# Logging Configuration (to show application logs on failure)
# log_cli = true # Commented out
# log_cli_level = INFO # Commented out
# Optional: Customize format if desired
# log_cli_format = %(levelname)-8s %(name)s:%(lineno)d: %(message)s
# log_cli_date_format = %Y-%m-%d %H:%M:%S

# Define asyncio mode (strict is recommended)
asyncio_mode = strict

# Explicitly set the default fixture loop scope (function is recommended)
asyncio_default_fixture_loop_scope = function

