[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "schedule-core"
version = "0.1.0"
description = "Transport-independent scheduling application and persistence"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-or-later"
authors = [{name = "Martin Bukowski", email = "martin@bmds.us"}]
dependencies = [
  "sqlalchemy[asyncio]>=2.0.40,<2.1",
  "sqlmodel>=0.0.24,<0.0.26",
  "pydantic>=2.4.2,<3",
  "pydantic-settings>=2.10,<3",
  "email-validator>=2.0,<3",
  "python-dateutil>=2.8.2,<5",
  "icalendar>=5.0.7,<8",
  "dateparser>=1.1.8,<2",
  "structlog>=23.2,<27",
  "colorama>=0.4.6,<0.6",
  "alembic>=1.12,<2",
  "aiosqlite>=0.19,<0.23",
  "asyncpg>=0.29,<0.33",
  "greenlet>=3.0,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/schedule_core"]
